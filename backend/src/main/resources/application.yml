spring:
  application:
    name: fullcycle-notes-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet.session.cookie:
    http-only: true
    secure: ${SESSION_COOKIE_SECURE:false}
    same-site: lax
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: never
app:
  cors.allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
logging.level:
  root: INFO
  com.fullcycle.notes: INFO
