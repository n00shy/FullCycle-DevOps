
services:
  postgres:
    image: postgres:16-alpine
    container_name: fullcycle-postgres
    environment:
      POSTGRES_DB: fullcycle_notes
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d fullcycle_notes"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: fullcycle-backend-devops
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/fullcycle_notes
      DB_USERNAME: notes_user
      DB_PASSWORD: local_dev_password
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      DB_POOL_SIZE: 5
      SESSION_COOKIE_SECURE: "false"
      APP_CORS_ALLOWED_ORIGIN: http://localhost:80
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fullcycle-devops
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
